# Navina KPIs — Retrieval Asset
# Derived from: knowledge/navina-master.yaml
# Sections: kpi_repository (KPI-001 to KPI-027), quality_measure_kpis, review_queue (REVIEW-001 to REVIEW-003)
# Use when: Battlecard, Exec Brief, Case Studies, Sales/Product/Clinical/Executive personas

retrieval_asset:
  name: navina-kpis
  version: v0.3
  derived_from: navina-master.yaml
  master_sections: [kpi_repository, quality_measure_kpis, review_queue_items_001_003]
  retrieval_priority: high
  load_when:
    - battlecard
    - exec_brief
    - case_studies
    - strengths_weaknesses
    - deep_dive
  exclude_when:
    - latest_news
  conflict_policy:
    - Preserve all metric variants with different scopes
    - Show source, time period, and scope for every metric
    - Do not combine customer-specific and global averages

kpi_repository:
  - kpi_id: KPI-001
    metric_name: Clinics
    value: 1300+
    source_ids: [SRC-001]
    confidence_level: high
    conflict_status: canonical

  - kpi_id: KPI-002
    metric_name: Clinicians and care team members
    value: 20000+
    source_ids: [SRC-001]
    confidence_level: high
    conflict_status: canonical

