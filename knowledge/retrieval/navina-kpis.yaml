    value: 3500000+
    source_ids: [SRC-001]
    confidence_level: high
    conflict_status: canonical

  - kpi_id: KPI-004
    metric_name: Weekly active providers
    value: 86%
    time_period: 2025 average across Navina customers
    source_ids: [SRC-001, SRC-006]
    confidence_level: high
    conflict_status: canonical
    notes: In parsed text from one source, 77/86 appears transposed; visual evidence and repeated usage support 86% weekly active providers.

