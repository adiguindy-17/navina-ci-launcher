conflict_resolutions:
  - review_id: REVIEW-001
    topic: Weekly active providers vs acceptance rate parsing
    resolution: Use 86% weekly active providers and 77% AI suggestions accepted as canonical. Some parsed sources transpose these; visual deck evidence is definitive.
    status: resolved_for_v0.3

  - review_id: REVIEW-002
    topic: 43% vs 49% diagnosis increase
    resolution: KPI-007 (43%) and KPI-009 (49%) are preserved as separate metrics — different source contexts. Do not merge or average.
    status: resolved_for_v0.3

  - review_id: REVIEW-003
    topic: 9-minute time saving wording
    resolution: KPI-008 stored as same metric family with wording variants across sources. Both refer to visit prep / chart review time saved.
    status: resolved_for_v0.3
