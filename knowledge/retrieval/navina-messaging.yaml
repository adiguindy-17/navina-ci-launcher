# Navina Messaging Library — Retrieval Asset
# Derived from: knowledge/navina-master.yaml
# Sections: messaging_library (MSG-001 to MSG-010), canonical_boundaries.messaging
# Use when: Marketing/Strategy persona, messaging requests

retrieval_asset:
  name: navina-messaging
  version: v0.3
  derived_from: navina-master.yaml
  master_sections: [messaging_library, canonical_boundaries.messaging]
  retrieval_priority: low
  runtime_scope: messaging_only
  load_conditions:
    - user explicitly requests messaging analysis or copy review
    - use_case: messaging_request
  do_not_load_for:
    - Battlecard
    - Deep Dive
    - Exec Brief
    - Product Overview
    - Latest News
    - Strengths & Weaknesses
    - Case Studies
  canonical_boundary:
    include:
      - original phrasing only
    handling:
      - do not rewrite
      - do not convert messaging into fact unless independently evidenced

