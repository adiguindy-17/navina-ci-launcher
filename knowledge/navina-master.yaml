review_queue:
  - review_id: REVIEW-001
    topic: Weekly active providers vs acceptance rate parsing
    issue: Some parsed text transposes 77% and 86%; visual deck and repeated source context support 86% weekly active providers and 77% accepted AI suggestions.
    current_resolution: Use 86% WAP and 77% acceptance as canonical.
    status: resolved_for_v0.3

  - review_id: REVIEW-002
    topic: 43% vs 49% diagnosis increase
    issue: 43% appears as 2025 average increase in identified diagnoses; 49% appears in AAFP/case-study context as increase in diagnoses found.
    current_resolution: Preserve as separate KPIs with source and scope.
    status: resolved_for_v0.3

  - review_id: REVIEW-003
    topic: 9-minute time saving wording
    issue: Sources describe this as visit prep per complex patient and also as chart review / visit preparation burden.
    current_resolution: Store as same metric family with wording variants.
    status: resolved_for_v0.3

  - review_id: REVIEW-004
    topic: Awards and certifications
    issue: Decks show badges, but exact award names, dates, and certificate validity require primary-source verification.
    current_resolution: Store with medium/low confidence and verification_status.
    status: open

  - review_id: REVIEW-005
    topic: Customer case confidentiality
    issue: Several cases are anonymized and include caveats that results vary.
    current_resolution: Store as anonymized customer evidence; do not use customer names or generalized promises.
    status: resolved_for_v0.3

  - review_id: REVIEW-006
    topic: Operational training details
    issue: Athena extension, login, FAQ, app URLs, and UI behaviors may change.
    current_resolution: Store under Product Knowledge / integration workflow with semi-stable or operational status, not stable company profile.
    status: resolved_for_v0.3

canonical_boundaries:
  stable_company_knowledge:
    include:
      - company description
      - market focus
      - target customers
      - product pillars
    exclude:
      - campaign slogans
      - implementation timelines
      - current UI instructions

  factual_product_knowledge:
    include:
      - modules
      - workflows
      - data sources
      - personas
      - capabilities
    exclude:
      - superiority claims
      - sales wording

  evidence:
    include:
      - KPIs
      - customer cases
      - quotes
      - study findings
    handling:
      - preserve source
      - preserve time period
      - preserve caveats
      - preserve customer-specific scope

  messaging:
    include:
      - original phrasing only
    handling:
      - do not rewrite
      - do not convert messaging into fact unless independently evidenced

  competitive_knowledge:
    include:
      - evidence-backed comparisons
      - EHR complement positioning
      - claims-only or retrospective workflow comparisons
    exclude:
      - unsupported competitor opinions
      - inferred superiority

